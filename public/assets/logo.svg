<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <title>Dave Buys Houses</title>
  <desc>Dave Buys Houses Indiana - primary stacked logo</desc>
  <!-- House mark -->
  <g transform="translate(150, 70)">
    <polygon points="-45,-12 0,-52 45,-12" fill="#2A2A2A"/>
    <rect x="-38" y="-5" width="76" height="50" fill="#2A2A2A"/>
    <path d="M -8,45 L -8,25 Q -8,15 0,15 Q 8,15 8,25 L 8,45 Z" fill="#F5F0E8"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="160" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="4" fill="#1F4429">DAVE BUYS HOUSES</text>
  <line x1="50" y1="173" x2="250" y2="173" stroke="#1F4429" stroke-width="0.5" opacity="0.4"/>
  <text x="150" y="190" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="6" fill="#1F4429" opacity="0.7">INDIANA</text>
</svg>
