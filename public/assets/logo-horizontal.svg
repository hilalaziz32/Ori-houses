<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <title>Dave Buys Houses</title>
  <desc>Dave Buys Houses Indiana - horizontal lockup logo</desc>
  <!-- House mark on left -->
  <g transform="translate(50, 50)">
    <polygon points="-28,-7 0,-32 28,-7" fill="#2A2A2A"/>
    <rect x="-24" y="-3" width="48" height="32" fill="#2A2A2A"/>
    <path d="M -5,29 L -5,16 Q -5,10 0,10 Q 5,10 5,16 L 5,29 Z" fill="#F5F0E8"/>
  </g>
  <!-- Wordmark on right -->
  <text x="100" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="3" fill="#1F4429">DAVE BUYS HOUSES</text>
  <line x1="100" y1="62" x2="370" y2="62" stroke="#1F4429" stroke-width="0.5" opacity="0.4"/>
  <text x="100" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="5" fill="#1F4429" opacity="0.7">INDIANA</text>
</svg>
